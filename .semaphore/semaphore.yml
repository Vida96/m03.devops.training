version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - sem-version python 3.12
      - checkout
blocks:
  - name: "\U0001F9EA Test"
    dependencies: []
    task:
      jobs:
        - name: "\U0001F7E2 Run Tests"
          commands:
            - cd 1-signing/
            - 'gpg --import /home/semaphore/public_vida.key '
            - gpg --import /home/semaphore/private_vida.key
            - gpg --output artifact.txt.sig --detach-sign artifact.txt
            - gpg --verify artifact.txt.sig artifact.txt
      secrets:
        - name: private_vida.key
        - name: pubilc_vida.key
  - name: "\U0001F680 Deploy"
    dependencies:
      - "\U0001F9EA Test"
    task:
      jobs:
        - name: "\U0001F4E6 Deploy to Production"
          commands:
            - cd 2-sbom
            - pip install cyclonedx-bom
            - 'cyclonedx-py requirements -o bom.json '
            - artifact push job bom.json
  - name: 'Block #3'
    dependencies:
      - "\U0001F680 Deploy"
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - cd 3-dependency-scanning
            - pip install pip-audit
            - pip-audit -r requirements.txt
