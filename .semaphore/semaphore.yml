version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - sem-version python 3.12
      - checkout
blocks:
  - name: Code singing
    dependencies: []
    task:
      jobs:
        - name: 'sign '
          commands:
            - cd 1-signing/
            - 'gpg --import /home/semaphore/public_vida.key '
            - gpg --import /home/semaphore/private_vida.key
            - gpg --output artifact.txt.sig --detach-sign artifact.txt
            - gpg --verify artifact.txt.sig artifact.txt
      secrets:
        - name: private_vida.key
        - name: pubilc_vida.key
  - name: SBOM
    dependencies:
      - Code singing
    task:
      jobs:
        - name: Cycllonedx
          commands:
            - cd 2-sbom
            - pip install cyclonedx-bom
            - 'cyclonedx-py requirements -o bom.json '
            - artifact push job bom.json
  - name: Audit dependencies
    dependencies:
      - SBOM
    task:
      jobs:
        - name: pip audit
          commands:
            - cd 3-dependency-scanning
            - sudo apt-get update
            - sudo apt-get install -y python3.12-venv
            - python3.12 -m venv venv
            - source venv/bin/activate
            - pip install pip-audit
            - pip-audit -r requirements.txt
  - name: SAST scan
    dependencies:
      - Audit dependencies
    task:
      jobs:
        - name: Bandit
          commands:
            - 'cd 4-sast '
            - sudo apt-get update
            - sudo apt-get install -y python3.12-venv
            - python3.12 -m venv venv
            - source venv/bin/activate
            - pip install bandit
            - bandit -r vulnerable_script.py
  - name: DAST Scan
    dependencies:
      - SAST scan
    task:
      jobs:
        - name: wapiti
          commands:
            - cd 5-dast
            - sudo apt-get update
            - sudo apt-get install -y python3.12-venv
            - 'python3.12 -m venv venv '
            - source venv/bin/activate
            - pip install -r requirements.txt
            - pip install wapiti3
            - 'gunicorn -b 0:0:0:0:4000 app:app --daemon'
            - 'wapiti -u http://localhost:4000 -f html'
            - artifact push job /home/semaphore/.wapiti/generated_report
